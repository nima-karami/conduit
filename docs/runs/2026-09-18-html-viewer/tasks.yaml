  - id: paste-truncation
    title: "Large multi-line paste into a terminal loses its tail"
    status: done — measured not ours; regression guard added per user choice
    tier: null
    added: "2026-09-18, by the user mid-run"
    report: |
      User pastes a page-long nested Markdown to-do list (copied from Notion) into a
      Conduit terminal running Claude Code. Previously a big paste was compacted/
      summarised in the UI but arrived intact; now the tail is dropped. User does not
      know whether the culprit is Conduit or Claude Code — that is the first thing to
      isolate, and it is isolable: paste the same payload into a plain `cmd.exe`
      session in Conduit and see whether the shell receives every byte. If it does,
      the bug is above Conduit; if it does not, it is Conduit's paste path.
    hypotheses:
      - "Unchunked write() to the ConPTY input pipe — a single large write can drop
         bytes past the pipe buffer. Highest prior."
      - "A cap/slice in the renderer paste path."
      - "Bracketed-paste not active, so embedded newlines submit early and the rest is
         eaten by whatever the first line launched."
    notes:
      - "Investigator dispatched. Decisive measurement designed: e2e harness paste into
         cmd.exe, compare bytes in vs bytes echoed."
      - "MEASURED: installed Claude Code is 2.1.274 (`claude --version`), at
         C:/Users/karam/.local/bin/claude.exe. A research agent attributed large-paste
         truncation to a 2.1.111-2.1.112 regression and cited issue numbers; that version
         range does not apply here and the citations are UNVERIFIED. Treat as a lead only."
      - "Actionable regardless of where the blame lands: a large paste should leave Conduit
         as ONE bracketed-paste envelope, in UTF-8-boundary-safe chunks, with small
         inter-chunk gaps. If Conduit currently issues a single large write to ConPTY, that
         is the likely cause and the fix is clear."

  - id: search-selection
    title: "Ctrl+Shift+F seeds global search from the current selection (VS Code parity)"
    status: done — all four surfaces seed, multi-line search shipped
    tier: LITE
    added: "2026-09-18, by the user mid-run"
    measured_today: |
      Global search ALREADY exists and Mod+Shift+F already opens it — the action
      `openGlobalSearch` is registered at webview/shortcuts.ts:53-57 with
      defaultCombo 'Mod+Shift+F', and its handler at webview/app.tsx:471-474
      un-collapses the Explorer then calls rightPaneRef.current?.openSearch(),
      which focuses the query input.

      The gap is exactly the seeding. SearchPaneHandle (webview/components/
      search-pane.tsx:9-13) exposes only focusInput() and clear() — there is no
      setQuery(). openGlobalSearch takes no argument and reads no selection from
      anywhere. So the chord opens an EMPTY box regardless of what is selected.
    shape: |
      Three pieces, none large:
        1. Read the selection from whichever surface is active (Monaco / xterm /
           rendered markdown / review rows / plain DOM).
        2. SearchPaneHandle gains setQuery(text) that sets the text, focuses AND
           select-alls the input, so typing replaces the seed — the VS Code feel.
        3. openGlobalSearch(seed?) threads it through; no selection keeps the
           previous query and selects it, which is also what VS Code does.
    open_decisions:
      - "Multi-line selection: if src/content-search is line-based, seed the first
         non-empty line rather than a query that can never match. Pending the
         investigation's answer on whether multi-line search is supported."
      - "Which surface is 'active' is the crux and must not be guessed — a file
         selection in the Explorer must NOT seed a text search."
    sequencing: |
      Touches webview/app.tsx, which Slice 4 of the html-viewer work also claims.
      Must therefore run BEFORE or AFTER that slice, never concurrently.
    known_gaps:
      - "A multi-line match renders WITHOUT a highlight. `highlightSegments` re-runs the
         matcher against `lineText` (one line), and a spanning match does not fit one line,
         so no <mark> is produced. No crash — just an un-highlighted result row. Arguably
         correct (there is no single line to highlight), but it is a visible difference from
         VS Code, which highlights the matched span across the rows it renders. Decide
         deliberately rather than discovering it."
      - "The async walker is the one the host actually runs (src/content-search-fs.ts:26) and
         nothing pinned its multi-line wiring until a surviving mutation (M5b) exposed it.
         A test now covers it. Worth remembering that the sync twin's coverage proved nothing
         about the path in production."
