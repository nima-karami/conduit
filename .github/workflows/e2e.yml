name: e2e
run-name: e2e ${{ inputs.selection || 'full' }} ${{ inputs.nonce || github.event_name }}

# Remote e2e on hosted Windows runners, dispatched by `npm run e2e:remote`, and nightly on main.
# Spec: docs/specs/2026-09-29-remote-e2e-lean-loop.md. No workflow-level `concurrency`: GitHub keeps
# one pending run per group and cancels the older one; the CLI coordinates full runs instead.
# "Nightly" below means the schedule, or a dispatch with mode=nightly (how the nightly path is
# exercised on a ci/e2e ref: a schedule only ever runs main's copy of this file).
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      selection:
        description: full | names | affected (affected lands in v1)
        type: choice
        options: [full, names, affected]
        default: affected
      scenarios:
        description: Space-separated exact scenario names (selection=names)
        type: string
        default: ''
      base:
        description: Base sha (selection=affected)
        type: string
        default: ''
      shards:
        description: Shard count, 0 = auto
        type: string
        default: '0'
      nonce:
        description: Correlation id, embedded in the run name
        type: string
        default: ''
      verify:
        description: Also run the verify gate (verify.yml) and include it in the verdict
        type: boolean
        default: true
      mode:
        description: nightly = also update the e2e-state artifact and sweep stale ci/e2e refs
        type: choice
        options: [normal, nightly]
        default: normal

permissions:
  contents: read
  actions: read

env:
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  verify:
    if: inputs.verify
    uses: ./.github/workflows/verify.yml

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
      excluded: ${{ steps.plan.outputs.excluded }}
      count: ${{ steps.plan.outputs.count }}
      state-id: ${{ steps.state.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # By artifact name, never by run conclusion: a red nightly's state is as current as a green
      # one's. Re-uploaded into this run so the state and report jobs don't look it up again.
      - id: state
        name: Latest e2e-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=e2e-state&per_page=30" > state-list.json
          id=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { newestArtifact } from "./test/e2e/ci-state.mjs";
            const a = newestArtifact(JSON.parse(readFileSync("state-list.json", "utf8")), "e2e-state");
            if (a) console.error(`e2e-state: artifact ${a.id} of run ${a.workflow_run?.id}, ${a.created_at}`);
            console.log(a ? a.id : "");
          ')
          if [ -z "$id" ]; then
            echo "no e2e-state artifact yet: timings from the seed"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > state.zip
          unzip -q -o state.zip -d state
          ls -l state
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - if: steps.state.outputs.id != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-state-prev
          path: state/
          retention-days: 1
      - id: plan
        env:
          SELECTION: ${{ inputs.selection || 'full' }}
          SCENARIOS: ${{ inputs.scenarios }}
          SHARDS: ${{ inputs.shards }}
        run: |
          node --input-type=module -e '
            import { existsSync, readdirSync, readFileSync, appendFileSync } from "node:fs";
            import { planShards } from "./test/e2e/ci-shard-plan.mjs";
            import { resolveTimings } from "./test/e2e/ci-state.mjs";
            import { applyExclusions } from "./test/e2e/smoke-select.mjs";
            const read = (f) => JSON.parse(readFileSync(f, "utf8"));
            const timings = resolveTimings(
              read("test/e2e/timings.seed.json"),
              existsSync("state/timings.json") ? read("state/timings.json") : null,
            );
            console.log(`timings: ${timings.source}`);
            const stems = readdirSync("test/e2e").filter((f) => f.endsWith(".e2e.mjs"))
              .map((f) => f.replace(".e2e.mjs", ""));
            const sel = process.env.SELECTION;
            if (sel === "affected") {
              console.log("::error::selection=affected lands in v1; dispatch full or names");
              process.exit(1);
            }
            const names = sel === "names" ? process.env.SCENARIOS.split(/\s+/).filter(Boolean) : stems;
            const unknown = names.filter((n) => !stems.includes(n));
            if (unknown.length) {
              console.log(`::error::unknown scenario(s): ${unknown.join(" ")}`);
              process.exit(1);
            }
            const { run, excluded } = applyExclusions(names, read("test/e2e/remote-exclusions.json"));
            for (const [n, why] of Object.entries(excluded)) console.log(`EXCLUDED ${n}: ${why}`);
            const { shards } = planShards(run, timings.medians, {
              shards: Number(process.env.SHARDS) || 0, cap: 16,
            });
            for (const s of shards) console.log(`shard ${s.index + 1}: ~${Math.round(s.estSec)}s, ${s.names.length} scenarios`);
            const include = shards.map((s) => ({ shard: s.index + 1, names: s.names.join(" ") }));
            const plan = { shards: shards.map((s) => ({ index: s.index, names: s.names })) };
            appendFileSync(process.env.GITHUB_OUTPUT, [
              `matrix=${JSON.stringify({ include })}`,
              `plan=${JSON.stringify(plan)}`,
              `excluded=${JSON.stringify(excluded)}`,
              `count=${shards.length}`,
            ].join("\n") + "\n");
          '

  shard:
    needs: prepare
    # An empty matrix `include` fails the run, so a selection that is all exclusions skips this.
    if: needs.prepare.outputs.count != '0'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: shard ${{ matrix.shard }}
    steps:
      # git-history reads this repo's own log; a depth-1 clone has one commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        env:
          HUSKY: '0'
      # Electron 43 has no postinstall: it downloads on first launch, which would land inside the
      # first scenario's timeout.
      - run: node node_modules/electron/install.js
      - run: npm run build
      # loadPlaywright (harness.mjs) looks in node_modules first. Playwright is deliberately not a
      # dependency, and the hosted npm cache is not where it looks for npx installs.
      - run: npm install --no-save --ignore-scripts playwright@${{ env.PLAYWRIGHT_VERSION }}
      # go-lsp needs gopls; mf-files silently SKIPs its trust phase without a Go toolchain.
      - if: contains(format(' {0} ', matrix.names), ' go-lsp ') || contains(format(' {0} ', matrix.names), ' mf-files ')
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - if: contains(format(' {0} ', matrix.names), ' go-lsp ') || contains(format(' {0} ', matrix.names), ' mf-files ')
        shell: pwsh
        run: |
          go install golang.org/x/tools/gopls@v0.23.0
          Join-Path (go env GOPATH) bin >> $env:GITHUB_PATH
      # Scenarios build scratch repos and commit; a hosted runner has no git identity.
      - run: |
          git config --global user.name "conduit-e2e"
          git config --global user.email "conduit-e2e@users.noreply.github.com"
      # Fails the job when a scenario failed; the report classifies from the JSON, not from this.
      - name: Run scenarios
        shell: pwsh
        env:
          E2E_NAMES: ${{ matrix.names }}
          SHARD: ${{ matrix.shard }}
          # The hosted TEMP is an 8.3 short path (RUNNER~1), which realpath expands; the
          # workspace confinement checks then read every scratch repo as outside the workspace.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        # Outside the checkout: scenarios open this repo, and stray dirs in it show up as changes.
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'e2e-out'
          New-Item -ItemType Directory -Force "$out/results", "$out/artifacts" | Out-Null
          node test/e2e/run-smoke.mjs @($env:E2E_NAMES -split " ") --json "$out/results/shard-$env:SHARD.json" --artifacts "$out/artifacts" --retry --quarantine test/e2e/quarantine.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-out/results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-fail-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-out/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [verify, prepare, shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: test/e2e
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-*
          path: results
          merge-multiple: true
      - if: needs.prepare.outputs.state-id != ''
        uses: actions/download-artifact@v4
        with:
          name: e2e-state-prev
          path: state
      - name: Merge results
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.mode == 'nightly' }}
          PLAN: ${{ needs.prepare.outputs.plan }}
          EXCLUDED: ${{ needs.prepare.outputs.excluded }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          SELECTION: ${{ inputs.selection || 'full' }}
          NONCE: ${{ inputs.nonce }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > run.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > artifacts.json
          mkdir -p out
          node --input-type=module -e '
            import { existsSync, readdirSync, readFileSync, writeFileSync, appendFileSync } from "node:fs";
            import { mergeResults, summaryMarkdown } from "./test/e2e/ci-merge-results.mjs";
            import { quarantineCandidates, updateFlakyHistory } from "./test/e2e/ci-state.mjs";
            const read = (f) => JSON.parse(readFileSync(f, "utf8"));
            const readState = (f) => (existsSync(`state/${f}`) ? read(`state/${f}`) : null);
            const run = read("run.json");
            const artifactUrls = {};
            for (const a of read("artifacts.json").artifacts ?? []) {
              const m = /^e2e-fail-(\d+)$/.exec(a.name);
              if (m) artifactUrls[m[1]] = `${run.html_url}/artifacts/${a.id}`;
            }
            const shardFiles = existsSync("results") ? readdirSync("results").map((f) => ({
              shard: Number(/shard-(\d+)/.exec(f)[1]), results: read(`results/${f}`),
            })) : [];
            const plan = process.env.PLAN ? JSON.parse(process.env.PLAN) : { shards: [] };
            const now = Date.now();
            // A nightly counts its own flakes, as the state job will record them.
            let history = readState("flaky-history.json") ?? {};
            if (process.env.NIGHTLY === "true") {
              history = updateFlakyHistory(history, shardFiles.flatMap((f) => f.results), { now });
            }
            const result = mergeResults(plan, shardFiles, {
              lastNightly: readState("last-nightly.json"),
              quarantineCandidates: quarantineCandidates(history, { now }),
              sha: process.env.GITHUB_SHA, nonce: process.env.NONCE, selection: process.env.SELECTION,
              runId: run.id, url: run.html_url, queuedAt: run.created_at, startedAt: run.run_started_at,
              finishedAt: new Date().toISOString(), verify: process.env.VERIFY_RESULT,
              prepare: process.env.PREPARE_RESULT,
              artifactUrls, excluded: process.env.EXCLUDED ? JSON.parse(process.env.EXCLUDED) : {},
            });
            writeFileSync("out/result.json", JSON.stringify(result, null, 2) + "\n");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, summaryMarkdown(result));
            console.log(`status: ${result.status}`);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-result
          path: out/result.json
          retention-days: 14
      - name: Verdict
        run: |
          status=$(node -p 'require("./out/result.json").status')
          echo "run status: $status"
          [ "$status" = passed ] || [ "$status" = flaky-passed ]

  # Nightly only, and whatever the verdict: a red nightly still records timings and flakes.
  state:
    needs: [prepare, shard]
    if: always() && needs.prepare.result == 'success' && (github.event_name == 'schedule' || inputs.mode == 'nightly')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: test/e2e
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: needs.prepare.outputs.state-id != ''
        uses: actions/download-artifact@v4
        with:
          name: e2e-state-prev
          path: prev
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-*
          path: results
          merge-multiple: true
      - name: Update state
        run: |
          mkdir -p out
          node --input-type=module -e '
            import { existsSync, readdirSync, readFileSync, writeFileSync } from "node:fs";
            import { lastNightly, updateFlakyHistory, updateTimings } from "./test/e2e/ci-state.mjs";
            const read = (f, d) => (existsSync(f) ? JSON.parse(readFileSync(f, "utf8")) : d);
            const write = (f, v) => writeFileSync(`out/${f}`, JSON.stringify(v, null, 2) + "\n");
            const rows = existsSync("results")
              ? readdirSync("results").flatMap((f) => read(`results/${f}`, []))
              : [];
            const now = Date.now();
            const sha = process.env.GITHUB_SHA;
            const runId = Number(process.env.GITHUB_RUN_ID);
            write("timings.json", { builtFrom: sha, ...updateTimings(read("prev/timings.json", null), rows) });
            write("flaky-history.json", updateFlakyHistory(read("prev/flaky-history.json", {}), rows, { now }));
            write("last-nightly.json", lastNightly(rows, { sha, runId, at: new Date(now).toISOString() }));
            for (const f of ["coverage-map.json"]) {
              if (existsSync(`prev/${f}`)) writeFileSync(`out/${f}`, readFileSync(`prev/${f}`));
            }
            console.log(`state from ${rows.length} results`);
          '
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-state
          path: out/
          retention-days: 30

  # Backstop for refs whose run never started; a run's own `cleanup` job deletes the rest.
  sweep:
    if: github.event_name == 'schedule' || inputs.mode == 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: test/e2e
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e '
            import { spawnSync } from "node:child_process";
            import { staleCiRefs } from "./test/e2e/ci-state.mjs";
            const repo = process.env.GITHUB_REPOSITORY;
            const api = (...args) => {
              const r = spawnSync("gh", ["api", ...args], { encoding: "utf8" });
              return { ok: r.status === 0, out: r.stdout, err: r.stderr };
            };
            const json = (...args) => {
              const r = api(...args);
              if (!r.ok) throw new Error(`gh api ${args.join(" ")}: ${r.err}`);
              return JSON.parse(r.out);
            };
            const refs = json("--paginate", "--slurp", `repos/${repo}/git/matching-refs/heads/ci/e2e/`).flat();
            const described = refs.map((r) => {
              const ref = r.ref.replace("refs/heads/", "");
              const commitAt = json(`repos/${repo}/commits/${r.object.sha}`).commit.committer.date;
              const runs = json(`repos/${repo}/actions/runs?branch=${encodeURIComponent(ref)}&per_page=20`)
                .workflow_runs.map(({ status, created_at }) => ({ status, created_at }));
              return { ref, commitAt, runs };
            });
            const stale = staleCiRefs(described, { now: Date.now() });
            console.log(`${refs.length} ci/e2e ref(s), ${stale.length} stale`);
            let failed = 0;
            for (const ref of stale) {
              const r = api("-X", "DELETE", `repos/${repo}/git/refs/heads/${ref}`);
              if (r.ok) console.log(`deleted ${ref}`);
              else if (/Reference does not exist/.test(r.err + r.out)) console.log(`${ref} already gone`);
              else {
                console.log(`::error::deleting ${ref}: ${r.err}`);
                failed++;
              }
            }
            process.exit(failed ? 1 : 0);
          '

  # The run owns its ref, so a cancelled run or a killed client still cleans up. After `state`,
  # which checks the ref out.
  cleanup:
    needs: [verify, prepare, shard, report, state]
    if: always() && startsWith(github.ref, 'refs/heads/ci/e2e/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${GITHUB_REF#refs/heads/}"
          if out=$(gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" 2>&1); then
            echo "deleted $ref"
          elif echo "$out" | grep -q "Reference does not exist"; then
            echo "$ref already gone"
          else
            echo "$out"
            exit 1
          fi
